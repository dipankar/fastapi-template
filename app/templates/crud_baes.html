<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CRUD Operations{% endblock %}</title>
    <script src="https://unpkg.com/htmx.org@1.6.1"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-gray-100">
    <div class="container mx-auto p-4">
        <h1 class="text-3xl font-bold mb-4">{% block header %}CRUD Operations{% endblock %}</h1>
        <div id="content">
            {% block content %}{% endblock %}
        </div>
    </div>
    <script>
        htmx.on("htmx:afterSwap", function(evt) {
            if (evt.detail.target.id === "content") {
                evt.detail.target.scrollIntoView({behavior: "smooth"});
            }
        });
    </script>
</body>
</html>
