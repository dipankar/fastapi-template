<!-- user_roles.html -->
<td colspan="4" class="px-6 py-4 whitespace-no-wrap border-b border-gray-500">
    <form hx-post="/users/{{ user.id }}/roles" hx-target="#user-roles-{{ user.id }}">
        {% for role in roles %}
        <label class="inline-flex items-center mt-3">
            <input type="checkbox" class="form-checkbox h-5 w-5 text-gray-600" name="role_ids" value="{{ role.id }}"
                   {% if role in user.roles %}checked{% endif %}>
            <span class="ml-2 text-gray-700">{{ role.name }}</span>
        </label>
        {% endfor %}
        <button type="submit" class="mt-3 bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
            Update Roles
        </button>
    </form>
</td>
